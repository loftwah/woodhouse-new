allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@aws-sdk/client-s3@3.1142.0"
  - "@modelcontextprotocol/sdk@1.31.0"
  - "@cloudflare/workers-types@5.20260929.1"
  - miniflare@5.20260926.1-alpha
  - wrangler@4.143.1
  - "@emdash-cms/admin@1.3.1"
  - "@emdash-cms/auth@1.3.1"
  - "@emdash-cms/blocks@1.3.1"
  - "@emdash-cms/cloudflare@1.3.1"
  - "@emdash-cms/gutenberg-to-portable-text@1.3.1"
  - emdash@1.3.1
  - "@storybook/builder-vite@10.6.6"
  - storybook@10.6.6
overrides:
  sharp@0.35.4: 0.35.5
  "undici@>=7 <7.30.1": 7.30.1
  dompurify@3.4.16: 3.4.17
  ip-address@10.7.2: 10.7.4
  "undici@>=8 <8.12.2": 8.12.2
  "zod@>=4 <4.6.6": 4.6.6
  fast-uri@3.1.8: 3.1.9
  body-parser@2.3.0: 2.4.0
  # @napi-rs/wasm-runtime accepts ^2.0.0-alpha.4 as a peer, so pnpm resolved
  # @emnapi/runtime 2.0.0-beta.2 for @astrojs/astro2tsx. On Node 22 that beta
  # throws "this.bridge.deleteEnv is not a function" during process cleanup and
  # aborts `astro check`. 1.11.3 satisfies the same peer range and is the stable
  # line every other consumer in this tree already uses. Remove when the beta is
  # fixed or @astrojs/astro2tsx stops needing the peer.
  "@emnapi/runtime": 1.11.3
